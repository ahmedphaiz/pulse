<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pulse">
<title>Pulse — Fitness</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0D10; --s1:#13161B; --s2:#1A1E25; --s3:#232831;
  --line:rgba(255,255,255,.07); --tx:#ECEEF1; --mu:#8B929D; --mu2:#5E6570;
  --acc:#C5F25A; --acc-d:rgba(197,242,90,.14);
  --hr:#FF6B57; --hr-d:rgba(255,107,87,.14);
  --sl:#6AA8FF; --sl-d:rgba(106,168,255,.14);
  --fd:#F5B84A; --fd-d:rgba(245,184,74,.14);
  --r:18px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 96px)}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
header.top h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.02em}
header.top .sub{color:var(--mu);font-size:13px;margin-top:2px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mu2);display:inline-block}
.dot.ok{background:var(--acc)} .dot.demo{background:var(--fd)} .dot.err{background:var(--hr)}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--s1);display:grid;place-items:center;border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px;stroke:var(--tx)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
.card h3 a,.link{color:var(--acc);text-transform:none;letter-spacing:0;font-weight:500;font-size:13px;cursor:pointer}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat .v{font-size:22px;font-weight:600}
.stat .v small{font-size:13px;color:var(--mu);font-weight:500;margin-left:2px}
.stat .l{font-size:12px;color:var(--mu);margin-top:2px}
.muted{color:var(--mu)} .small{font-size:13px} .tiny{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--s3);color:var(--mu)}
.pill.acc{background:var(--acc-d);color:var(--acc)} .pill.hr{background:var(--hr-d);color:var(--hr)} .pill.sl{background:var(--sl-d);color:var(--sl)} .pill.fd{background:var(--fd-d);color:var(--fd)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:13px;background:var(--s3);font-weight:600;font-size:14.5px}
.btn.primary{background:var(--acc);color:#11140A}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--hr-d);color:var(--hr)}
.btn.block{width:100%}
.btn svg,.chip svg{width:18px;height:18px;flex:none}
.chip svg{width:16px;height:16px}
.btn.sm{height:34px;padding:0 13px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45}
/* ring */
.ringwrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:26px;font-weight:700;display:block;letter-spacing:-.02em}
.ring .c span{font-size:12px;color:var(--mu)}
.ministats{flex:1;display:grid;gap:12px}
.ms{display:flex;align-items:center;gap:10px}
.ms i{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.ms i svg{width:17px;height:17px}
.ms .v{font-weight:600;font-size:16px}
.ms .l{font-size:12px;color:var(--mu)}
/* alert cards */
.alert{border-radius:var(--r);padding:14px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start;border:1px solid}
.alert.live{background:linear-gradient(135deg,rgba(255,107,87,.16),rgba(255,107,87,.04));border-color:rgba(255,107,87,.3)}
.alert.det{background:linear-gradient(135deg,rgba(197,242,90,.13),rgba(197,242,90,.03));border-color:rgba(197,242,90,.25)}
.alert .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.alert.live .ic{background:var(--hr-d)} .alert.det .ic{background:var(--acc-d)}
.alert .t{font-weight:600}
.alert .d{font-size:13px;color:var(--mu);margin:2px 0 10px}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
/* list */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:2px}
.li .ic{width:40px;height:40px;border-radius:12px;background:var(--s2);display:grid;place-items:center;flex:none}
.li .ic svg{width:19px;height:19px}
.li .m{flex:1;min-width:0}
.li .m .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m .s{font-size:12.5px;color:var(--mu)}
.li .r{text-align:right;font-weight:600}
.li .r small{display:block;font-size:12px;color:var(--mu);font-weight:500}
.del{color:var(--mu2);padding:6px}
.del svg{width:16px;height:16px;stroke:currentColor}
.dayh{font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin:18px 2px 8px}
.empty{text-align:center;color:var(--mu);padding:26px 10px;font-size:14px}
.empty svg{width:34px;height:34px;stroke:var(--mu2);margin-bottom:6px}
/* bars */
.bar{height:8px;border-radius:99px;background:var(--s3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.macro .l{font-size:12px;color:var(--mu);margin-bottom:5px;display:flex;justify-content:space-between}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(11,13,16,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:var(--sb)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mu2);font-size:11px;font-weight:600}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor}
nav.tabs button.on{color:var(--acc)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--s1);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;padding:10px 18px calc(var(--sb) + 18px);transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow-y:auto}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:var(--s3);margin:0 auto 12px}
.sheet h2{font-size:20px;margin:0 0 16px;letter-spacing:-.01em}
label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-size:12.5px;color:var(--mu);margin-bottom:6px;font-weight:500}
.inp{width:100%;height:46px;border-radius:12px;background:var(--s2);border:1px solid var(--line);padding:0 14px;outline:none;font-size:16px}
.inp:focus{border-color:rgba(197,242,90,.5)}
textarea.inp{height:auto;min-height:70px;padding:12px 14px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:11px;background:var(--s2);border:1px solid var(--line);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--acc-d);border-color:rgba(197,242,90,.45);color:var(--acc)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:var(--s2);margin-bottom:14px}
.toggle .k{font-size:14px;font-weight:500}
.toggle .k small{display:block;color:var(--mu);font-size:12px;font-weight:400}
.sw{width:46px;height:28px;border-radius:99px;background:var(--s3);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--acc)} .sw.on::after{transform:translateX(18px);background:#11140A}
.sec{font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 10px}
/* coach */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.5;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--acc);color:#11140A;border-bottom-right-radius:5px;font-weight:500}
.msg.a{align-self:flex-start;background:var(--s1);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.a p{margin:0 0 8px} .msg.a p:last-child{margin:0}
.msg.a ul{margin:4px 0 8px;padding-left:18px} .msg.a li{margin:2px 0}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mu);margin-right:4px;animation:pulse 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
.composer{position:fixed;left:0;right:0;bottom:calc(var(--sb) + 63px);z-index:15;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 16px 10px}
.composer .in{max-width:528px;margin:0 auto;display:flex;gap:8px}
.composer .inp{border-radius:14px}
.sendbtn{width:46px;height:46px;border-radius:14px;background:var(--acc);display:grid;place-items:center;flex:none}
.sendbtn svg{width:20px;height:20px;stroke:#11140A}
.coachhero{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.coachhero .av{width:44px;height:44px;border-radius:14px;background:var(--acc-d);display:grid;place-items:center}
.coachhero .av svg{width:22px;height:22px;stroke:var(--acc)}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 80px);transform:translate(-50%,20px);background:var(--s3);color:var(--tx);padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:500;z-index:60;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center;border:1px solid var(--line)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.daynav button{width:38px;height:38px;border-radius:11px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center}
.daynav button svg{width:18px;height:18px;stroke:var(--tx)}
.daynav b{font-size:15px}
.seg{display:flex;background:var(--s2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;height:32px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mu)}
.seg button.on{background:var(--s3);color:var(--tx)}
.chart text{fill:var(--mu2);font-size:10px;font-family:Inter,sans-serif}
.note{font-size:12.5px;color:var(--mu);background:var(--s2);border-radius:12px;padding:10px 12px;margin-bottom:14px;line-height:1.5}
.note code{background:var(--s3);padding:1px 5px;border-radius:5px;font-size:12px}
svg.i{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* zones */
.zl{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px}
.zl span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--mu)}
.zl i{width:8px;height:8px;border-radius:50%;display:inline-block}
/* live workout */
#live{position:fixed;inset:0;z-index:70;background:#000;display:none;flex-direction:column;padding:calc(var(--st) + 16px) 20px calc(var(--sb) + 20px);user-select:none}
#live.on{display:flex}
#live .lt{display:flex;justify-content:space-between;align-items:center}
#live .lt b{font-size:17px}
#live .timer{font-size:20px;font-weight:600;color:#ECEEF1}
#live .hrsrc{font-size:12px;color:var(--mu);display:flex;align-items:center;gap:6px}
#live .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform 1.2s}
#live .bpm{font-size:min(34vw,200px);font-weight:700;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;transition:color .6s}
#live .zname{font-size:20px;font-weight:600;margin-top:6px;letter-spacing:.02em;transition:color .6s}
#live .zbar{display:flex;gap:4px;width:min(80vw,360px);margin-top:18px}
#live .zbar i{flex:1;height:8px;border-radius:4px;opacity:.22;transition:opacity .4s}
#live .zbar i.on{opacity:1}
#live .lstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin-bottom:16px}
#live .lstats .v{font-size:22px;font-weight:600}
#live .lstats .l{font-size:12px;color:var(--mu)}
#live .lbtns{display:flex;gap:10px}
#live .lbtns .btn{flex:1;height:52px}
#live.dim .lt,#live.dim .lstats,#live.dim .lbtns,#live.dim .zbar,#live.dim .hint{opacity:0;pointer-events:none}
#live.dim .bpm,#live.dim .zname{filter:brightness(.62)}
#live .hint{text-align:center;font-size:12px;color:var(--mu2);margin-bottom:10px}
.tap{cursor:pointer;transition:transform .12s,background .15s}
.tap:active{transform:scale(.985)}
.card.tap:hover{background:#161a20}
.chev{color:var(--mu2);font-size:18px;line-height:1;margin-left:4px}
.ms.tap{border-radius:12px;margin:-4px;padding:4px}
.ms.tap:active{background:var(--s2)}
.scrub{position:relative;touch-action:pan-y}
.scrub .vline{position:absolute;top:8px;bottom:20px;width:1px;background:rgba(255,255,255,.35);display:none;pointer-events:none}
.scrub .tip{position:absolute;top:-6px;transform:translateX(-50%);background:var(--s3);border:1px solid var(--line);border-radius:9px;padding:4px 9px;font-size:12px;font-weight:600;white-space:nowrap;display:none;pointer-events:none;z-index:2}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tile{background:var(--s2);border-radius:12px;padding:10px 11px}
.tile .v{font-size:19px;font-weight:600}
.tile .v small{font-size:12px;color:var(--mu);font-weight:500;margin-left:2px}
.tile .l{font-size:11.5px;color:var(--mu);margin-top:1px}
.zrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.zrow .n{width:70px;font-size:13px;font-weight:600}
.zrow .bar{flex:1}
.zrow .m{width:78px;text-align:right;font-size:12.5px;color:var(--mu)}
.dhead{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.dhead .ic{width:46px;height:46px;border-radius:14px;background:var(--acc-d);display:grid;place-items:center;flex:none}
.dhead .ic svg{width:23px;height:23px}
.dhead h2{margin:0 !important}
.loading{color:var(--mu);font-size:13px;padding:24px 0;text-align:center}
.liveCard{background:linear-gradient(135deg,rgba(255,77,94,.16),rgba(255,77,94,.03));border:1px solid rgba(255,77,94,.3)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs"><div class="in" id="nav"></div></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div id="live"></div>

<script>
/* ============ Icons ============ */
const IC={
 home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
 run:'<circle cx="13" cy="4" r="2"/><path d="M4 22l4-7 3 2 2 5"/><path d="M6 12l3-4 4 1 3 4 3 1"/><path d="M11 17l2-6"/>',
 food:'<path d="M4 3v8a3 3 0 003 3v7"/><path d="M8 3v8M6 3v5"/><path d="M17 21V3c-2 1-3 4-3 8h3"/>',

 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.6 1.6 0 00-1-1.5 1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H3a2 2 0 110-4h.1a1.6 1.6 0 001.5-1 1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V3a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/>',
 heart:'<path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 00-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 000-7.8z"/>',
 flame:'<path d="M12 22c4 0 7-3 7-7 0-5-5-7-5-12-3 2-5 5-5 8-1-1-2-2-2-4-2 2-2 5-2 8 0 4 3 7 7 7z"/>',
 timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>',
 moon:'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 x:'<path d="M18 6L6 18M6 6l12 12"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
 send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',
 left:'<path d="M15 18l-6-6 6-6"/>', right:'<path d="M9 18l6-6-6-6"/>',
 refresh:'<path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0114.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0020.5 15"/>',
 bolt:'<path d="M13 2L3 14h9l-1 8 10-12h-9z"/>',
 dumbbell:'<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>',
 bike:'<circle cx="5.5" cy="17" r="3.5"/><circle cx="18.5" cy="17" r="3.5"/><path d="M15 6h2l3 11M5.5 17L9 9h6l-3.5 8M12 6h3"/>',

let chartSeq=0; window.__charts={};
function hrChart(hr,sessions,th,T0,T1,Hh=150,scrub){
 const W=520,pl=4,pr=30,pt=10,pb=20; if(!hr.length) return '<div class="empty small">No heart-rate data yet</div>';
 const t0=T0||sod(new Date()).getTime(),t1=T1||Date.now(),tEnd=T1?t1:Math.max(t1,t0+6*3600e3); const pts=hr.filter(x=>x.t>=t0&&x.t<=t1); if(pts.length<2) return '<div class="empty small">No heart-rate data for this period yet</div>';
 const step=Math.max(1,Math.floor(pts.length/300)); const ds=[];for(let i=0;i<pts.length;i+=step){const sl=pts.slice(i,i+step);ds.push({t:sl[0].t,bpm:sl.reduce((a,b)=>a+b.bpm,0)/sl.length})}
 const lo=Math.min(45,...ds.map(d=>d.bpm))-5, hi=Math.max((th||0)+15,...ds.map(d=>d.bpm))+5;
 const x=t=>pl+(t-t0)/(tEnd-t0)*(W-pl-pr), y=b=>pt+(1-(b-lo)/(hi-lo))*(Hh-pt-pb);
 // one path per run of same zone, so the line changes colour with your heart rate
 let segs='',cur=null,path='';
 ds.forEach((d,i)=>{const z=zoneIdx(d.bpm),P=x(d.t).toFixed(1)+','+y(d.bpm).toFixed(1);
  if(z!==cur){ if(path) segs+=`<path d="${path}L${P}" fill="none" stroke="${ZONES[cur].c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`; cur=z; path='M'+P } else path+='L'+P });
 if(path) segs+=`<path d="${path}" fill="none" stroke="${ZONES[cur].c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
 const line=ds.map((d,i)=>(i?'L':'M')+x(d.t).toFixed(1)+','+y(d.bpm).toFixed(1)).join('');
 const area=line+`L${x(ds[ds.length-1].t).toFixed(1)},${Hh-pb}L${x(ds[0].t).toFixed(1)},${Hh-pb}Z`;
 const bands=(sessions||[]).filter(s=>s.end>t0&&s.start<t1).map(s=>`<rect x="${x(Math.max(s.start,t0))}" y="${pt}" width="${Math.max(2,x(Math.min(s.end,t1))-x(Math.max(s.start,t0)))}" height="${Hh-pt-pb}" fill="rgba(255,255,255,.05)" rx="4"/>`).join('');
 const zl=ZONES.slice(0,-1).map(z=>Math.round(z.hi*maxHR())).filter(v=>v>lo&&v<hi).map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="${zoneOf(v+1).c}" stroke-opacity=".22" stroke-dasharray="2 5"/>`).join('');
 let ticks='';
 if(T1){[t0,t0+(t1-t0)/2,t1].forEach((t,i)=>ticks+=`<text x="${x(t)}" y="${Hh-4}" text-anchor="${['start','middle','end'][i]}" ${i===2?`dx="-${pr-4}"`:''}>${fmtT(t)}</text>`)}
 else for(let h=0;h<=24;h+=6){const t=t0+h*3600e3;if(t<=tEnd)ticks+=`<text x="${x(t)}" y="${Hh-4}" text-anchor="${h?'middle':'start'}">${h===0?'12a':h===12?'12p':h>12?(h-12)+'p':h+'a'}</text>`}
 const yt=[Math.round(lo+10),Math.round(hi-5)].map(v=>`<text x="${W-2}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join('');
 const svgOut=`<svg class="chart" viewBox="0 0 ${W} ${Hh}" width="100%" preserveAspectRatio="none" style="display:block;height:${Hh}px">
  <defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>
  ${bands}${zl}<path d="${area}" fill="url(#hg)"/>${segs}${ticks}${yt}</svg>`;
 if(!scrub) return svgOut;
 const k='c'+(++chartSeq); window.__charts[k]={ds,t0,tEnd,W,pl,pr};
 return `<div class="scrub" data-k="${k}">${svgOut}<div class="vline"></div><div class="tip"></div></div>`;
}
function barChart(vals,labels,goal,color,keys){
 const W=520,Hh=120,pb=20,max=Math.max(goal||0,...vals,1)*1.08,bw=(W/vals.length)*.56;
 const bars=vals.map((v,i)=>{const cx=(i+.5)*W/vals.length,h=(v/max)*(Hh-pb-6);const on=goal&&v>=goal;return `<g ${keys?`data-a="day" data-d="${keys[i]}" class="tap"`:''}><rect x="${cx-W/vals.length/2}" y="0" width="${W/vals.length}" height="${Hh}" fill="transparent"/><rect x="${cx-bw/2}" y="${Hh-pb-h}" width="${bw}" height="${Math.max(h,2)}" rx="6" fill="${on?color:(i===vals.length-1?color:'#2A303A')}" opacity="${on||i===vals.length-1?1:.9}"/><text x="${cx}" y="${Hh-5}" text-anchor="middle">${labels[i]}</text></g>`}).join('');
 const gl=goal?`<line x1="0" x2="${W}" y1="${Hh-pb-(goal/max)*(Hh-pb-6)}" y2="${Hh-pb-(goal/max)*(Hh-pb-6)}" stroke="rgba(255,255,255,.2)" stroke-dasharray="3 4"/>`:'';
 return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" width="100%" style="display:block">${gl}${bars}</svg>`;
}
function weightChart(ws,days){
 const W=520,Hh=170,pl=4,pr=34,pt=12,pb=20; const t1=Date.now(),t0=t1-days*864e5; const pts=ws.filter(w=>w.t>=t0);
 if(pts.length<2) return '<div class="empty small">Log a couple of weigh-ins to see your trend</div>';
 const conv=kgToU; const vs=pts.map(p=>conv(p.kg)); const goal=S.settings.goalWeight?+S.settings.goalWeight:null;
 let lo=Math.min(...vs),hi=Math.max(...vs); if(goal&&goal>lo-3&&goal<hi+3){lo=Math.min(lo,goal);hi=Math.max(hi,goal)} const padv=Math.max(.5,(hi-lo)*.15);lo-=padv;hi+=padv;
 const x=t=>pl+(t-t0)/(t1-t0)*(W-pl-pr), y=v=>pt+(1-(v-lo)/(hi-lo))*(Hh-pt-pb);
 const avg=pts.map((p,i)=>{const win=pts.filter(q=>q.t<=p.t&&q.t>p.t-7*864e5);return{t:p.t,v:win.reduce((a,b)=>a+conv(b.kg),0)/win.length}});
 const tl=avg.map((d,i)=>(i?'L':'M')+x(d.t).toFixed(1)+','+y(d.v).toFixed(1)).join('');
 const dots=pts.map(p=>`<circle cx="${x(p.t)}" cy="${y(conv(p.kg))}" r="3" fill="#13161B" stroke="rgba(197,242,90,.55)" stroke-width="1.5"/>`).join('');
 const gl=goal?`<line x1="${pl}" x2="${W-pr}" y1="${y(goal)}" y2="${y(goal)}" stroke="rgba(106,168,255,.5)" stroke-dasharray="4 4"/><text x="${W-2}" y="${y(goal)+3}" text-anchor="end" style="fill:#6AA8FF">goal</text>`:'';
 const yt=[lo+padv,hi-padv].map(v=>`<text x="${W-2}" y="${y(v)+3}" text-anchor="end">${v.toFixed(1)}</text>`).join('');
 const xt=[t0,t0+(t1-t0)/2,t1].map((t,i)=>`<text x="${x(t)}" y="${Hh-4}" text-anchor="${['start','middle','end'][i]}" ${i===2?`dx="-${pr-4}"`:''}>${new Date(t).toLocaleDateString([], {month:'short',day:'numeric'})}</text>`).join('');
 return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" width="100%" style="display:block">${gl}${dots}<path d="${tl}" fill="none" stroke="#C5F25A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${yt}${xt}</svg>`;
}
function ring(p,color,size=132,sw=12){const r=(size-sw)/2,c=2*Math.PI*r;return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#232831" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(1,p))}" style="transition:stroke-dashoffset .8s"/></svg>`}
const kgToU=kg=>S.settings.unit==='lb'?kg*2.20462:kg;
const uToKg=v=>S.settings.unit==='lb'?v/2.20462:v;

/* ============ Views ============ */

 if(S.settings.demo) return '<span class="dot demo"></span>Demo data';
 if(syncing) return '<span class="dot ok pulse"></span>Syncing…';

 return `<span class="dot ${syncErrors.length?'err':'ok'}"></span>${S.lastSync?'Synced '+fmtT(S.lastSync):'Connected'}`;
}
function header(title){
 return `<header class="top"><div><h1>${title}</h1><div class="sub">${statusLine()}</div></div>
 <div class="row" style="gap:8px"><button class="iconbtn" data-a="sync" aria-label="Sync">${ico('refresh')}</button><button class="iconbtn" data-a="settings" aria-label="Settings">${ico('gear')}</button></div></header>`;
}

 html+=`<div class="card tap" data-a="hr"><h3>Heart rate today <span class="pill hr">${lastHR?'Last '+fmtT(lastHR.t):'—'}</span></h3>${hrChart(h.hr||[],[...sessions,...allWorkouts()],th)}

function vWeight(){

function mdLite(t){

  if(m){if(!inL){out+='<ul>';inL=true}out+='<li>'+m[1]+'</li>'} else {if(inL){out+='</ul>';inL=false} if(l.trim())out+='<p>'+l.replace(/^#+\s*/,'')+'</p>'}});

const SYS=`You are Pulse Coach, a friendly, direct personal fitness coach inside the user's fitness tracker app. You have the user's live data below. Ground every answer in their numbers (cite them briefly). Be concise: short paragraphs or a few bullets, phone-screen friendly, under ~170 words unless asked for a plan. Give concrete, actionable suggestions (sets/reps, durations, targets). Note that you're not a doctor when health concerns come up and suggest seeing one for pain, chest symptoms, dizziness or anything worrying. Never encourage extreme dieting or overtraining.`;
async function askClaude(messages,system,maxTokens=700){

  body:JSON.stringify({model:S.settings.model||'claude-haiku-5-5',max_tokens:maxTokens,system,messages})});
 const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
 return (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
}

// Heart-rate stats for any time window: zones, calories, training load (TRIMP)
function hrStats(pts,t0,t1){
 const sm=pts.filter(x=>x.t>=t0&&x.t<=t1); const secs=new Array(ZONES.length).fill(0); let kcal=0,load=0;
 const rest=restHR(),mx=maxHR(),male=S.settings.sex!=='female';
 for(let i=0;i<sm.length;i++){const dt=Math.min(120,((i+1<sm.length?sm[i+1].t:Math.min(t1,sm[i].t+5000))-sm[i].t)/1000);secs[zoneIdx(sm[i].bpm)]+=dt;kcal+=kcalPerMin(sm[i].bpm)*dt/60;
  const r=Math.max(0,Math.min(1,(sm[i].bpm-rest)/(mx-rest)));load+=dt/60*r*0.64*Math.exp((male?1.92:1.67)*r)}

 return {n:sm.length,avg:b.length?Math.round(b.reduce((a,c)=>a+c,0)/b.length):null,max:b.length?Math.max(...b):null,min:b.length?Math.min(...b):null,secs,kcal:Math.round(kcal),load:Math.round(load),pts:sm};
}
const loadLabel=l=>l<25?'Light':l<60?'Moderate':l<120?'Hard':'Very hard';

async function hrFor(id,t0,t1){
 S.hrCache=S.hrCache||{};
 if(S.hrCache[id]) return S.hrCache[id].map(x=>({t:x[0],bpm:x[1]}));
 const local=(H().hr||[]).filter(x=>x.t>=t0&&x.t<=t1);
 if(S.settings.demo||!S.settings.connected) return local;
 if(local.length>20&&local[0].t-t0<5*60e3) return local;
 if(!(await ensureToken())){ if(!local.length){const e=new Error('needauth');e.needAuth=true;throw e} return local }
 const a=new Date(t0).toISOString(),b=new Date(t1).toISOString();
 let pts; try{pts=await listAll('heart-rate',`heart_rate.sample_time.physical_time >= "${a}" AND heart_rate.sample_time.physical_time <= "${b}"`,20000)}
 catch(e){pts=await listAll('heart-rate',`heart_rate.sample_time.physical_time >= "${a}"`,20000)}
 const arr=pts.map(p=>[Date.parse(p.heartRate.sampleTime.physicalTime),+p.heartRate.beatsPerMinute]).filter(x=>x[0]>=t0&&x[0]<=t1&&x[1]).sort((x,y)=>x[0]-y[0]);
 const ds=[];let lt=0;arr.forEach(x=>{if(x[0]-lt>=5000){ds.push(x);lt=x[0]}});
 if(ds.length){S.hrCache[id]=ds;const ks=Object.keys(S.hrCache);if(ks.length>80)delete S.hrCache[ks[0]];save()}

 if(w.hr&&w.hr.length>1){const pts=w.hr.map(x=>({t:x[0],bpm:x[1]}));render_(hrStats(pts,w.start,w.end));return}

 try{const pts=await hrFor(w.id,w.start,w.end);render_(pts.length?hrStats(pts,w.start,w.end):null)}catch(e){if(e.needAuth)render_({needAuth:true});else{render_(null);toast('Heart rate: '+e.message)}}
}
async function sheetDetected(t0,t1){
 const pts=(H().hr||[]); const hs=hrStats(pts,t0,t1),m=(t1-t0)/60e3;
 openSheet(`<div class="dhead"><div class="ic">${ico('bolt','#C5F25A')}</div><div><h2>Detected activity</h2><div class="small muted">${fmtD(t0)} · ${fmtT(t0)}–${fmtT(t1)}</div></div></div>
 <div class="tiles">${tile(dur(m),'duration')}${tile(hs.kcal+'<small>kcal</small>','calories (est.)')}${tile(hs.load,'load · '+loadLabel(hs.load))}${tile(hs.avg||'--','avg bpm',hs.avg?zoneOf(hs.avg).c:'')}${tile(hs.max||'--','max bpm',hs.max?zoneOf(hs.max).c:'')}${tile(hs.min||'--','min bpm')}</div>
 ${hs.n>1?hrChart(hs.pts,[],0,t0,t1,150,true):''}<div class="sec">Time in zones</div>${zoneRows(hs.secs)}
 <div class="row" style="gap:8px;margin-top:14px"><button class="btn ghost" style="flex:1" id="nw">Not a workout</button><button class="btn primary" style="flex:1" id="lg">Log it</button></div>`,r=>{
  r.querySelector('#lg').onclick=()=>sheetWorkout({start:t0,end:t1,kcal:hs.kcal,detected:true,type:'WORKOUT'});
  r.querySelector('#nw').onclick=()=>{S.dismissed.push(Math.round(t0/60e3));save();closeSheet();render();toast('Hidden')}});
}
function sheetHR(){
 const h=H(),t0=sod(new Date()).getTime(),pts=(h.hr||[]).filter(x=>x.t>=t0),hs=hrStats(pts,t0,Date.now()),last=pts[pts.length-1];
 const ws=allWorkouts().filter(w=>w.end>t0);
 openSheet(`<h2>Heart rate today</h2>
 <div class="tiles">${tile(last?last.bpm:'--','latest'+(last?' · '+fmtT(last.t):''),last?zoneOf(last.bpm).c:'')}${tile(restHR(),'resting')}${tile(hs.avg||'--','average')}${tile(hs.min||'--','lowest')}${tile(hs.max||'--','highest',hs.max?zoneOf(hs.max).c:'')}${tile(maxHR(),'est. max')}</div>
 ${hrChart(pts,ws,0,0,0,170,true)}<div class="tiny muted" style="margin:4px 0 6px">Drag across the chart to see exact values</div>
 <div class="sec">Time in zones today</div>${zoneRows(hs.secs)}
 ${ws.length?`<div class="sec">Workouts today</div>`+workoutList(ws):''}
 <div class="tiny muted" style="margin-top:12px">Zones are % of your estimated max heart rate (208 − 0.7 × age). Change your age in Settings.</div>
 <div style="height:12px"></div><button class="btn block" data-close>Close</button>`,r=>r.querySelector('[data-close]').onclick=closeSheet);
}
function sheetSteps(){
 const h=H(),s7=h.steps7||[],g=S.settings.stepGoal,tot=s7.reduce((a,b)=>a+b.steps,0),best=s7.reduce((a,b)=>b.steps>a.steps?b:a,{steps:0}),hit=s7.filter(x=>x.steps>=g).length;
 const today=s7.find(x=>x.date===dkey(new Date()));
 openSheet(`<h2>Steps</h2>
 <div class="tiles">${tile(fmtN(today?today.steps:0),'today')}${tile(Math.round((today?today.steps:0)/g*100)+'<small>%</small>','of goal')}${tile(fmtN(tot/Math.max(1,s7.length)),'7-day avg')}${tile(fmtN(tot),'7-day total')}${tile(fmtN(best.steps),'best · '+(best.date?new Date(best.date+'T12:00').toLocaleDateString([], {weekday:'short'}):''))}${tile(hit+'/7','goal days')}</div>
 ${barChart(s7.map(x=>x.steps),s7.map(x=>new Date(x.date+'T12:00').toLocaleDateString([], {weekday:'short'})),g,'#C5F25A',s7.map(x=>x.date))}
 <div class="list" style="margin-top:10px">${s7.slice().reverse().map(x=>`<div class="li tap" data-a="day" data-d="${x.date}"><div class="m"><div class="t">${dayLabel(x.date)}</div><div class="bar" style="margin-top:6px"><i style="width:${Math.min(100,x.steps/g*100)}%;background:${x.steps>=g?'var(--acc)':'#5E6570'}"></i></div></div><div class="r num">${fmtN(x.steps)}</div><span class="chev">›</span></div>`).join('')}</div>
 <div class="tiny muted" style="margin-top:10px">≈ ${(tot/Math.max(1,s7.length)*0.00075).toFixed(1)} km a day (estimated from steps). Goal: ${fmtN(g)} — change it in Settings.</div>
 <div style="height:12px"></div><button class="btn block" data-close>Close</button>`,r=>r.querySelector('[data-close]').onclick=closeSheet);
}
function sheetKcal(){
 const h=H(),s7=h.steps7||[],k7=(h.activeKcal7&&h.activeKcal7.length===7)?h.activeKcal7:s7.map(x=>Math.round(x.steps*.045));
 const days=s7.map(x=>x.date), eaten=days.map(d=>Math.round(sumF(foodsOn(d),'kcal'))), tot=k7.reduce((a,b)=>a+b,0);
 openSheet(`<h2>Active calories</h2>
 <div class="tiles">${tile(fmtN(k7[6]||0),'burned today')}${tile(fmtN(eaten[6]||0),'eaten today')}${tile(fmtN(tot/7),'7-day avg')}</div>
 ${barChart(k7,days.map(d=>new Date(d+'T12:00').toLocaleDateString([], {weekday:'short'})),0,'#F5B84A',days)}
 <div class="list" style="margin-top:10px">${days.slice().reverse().map((d,j)=>{const i=6-j;return `<div class="li tap" data-a="day" data-d="${d}"><div class="m"><div class="t">${dayLabel(d)}</div><div class="s">${eaten[i]?fmtN(eaten[i])+' kcal eaten':'food not logged'}</div></div><div class="r num">${fmtN(k7[i])}<small>active kcal</small></div><span class="chev">›</span></div>`}).join('')}</div>
 <div class="tiny muted" style="margin-top:10px">Active calories are what you burn moving, on top of your resting burn.</div>
 <div style="height:12px"></div><button class="btn block" data-close>Close</button>`,r=>r.querySelector('[data-close]').onclick=closeSheet);
}
function sheetDay(d){
 const h=H(),st=(h.steps7||[]).find(x=>x.date===d),i=(h.steps7||[]).findIndex(x=>x.date===d),k=i>=0&&h.activeKcal7?h.activeKcal7[i]:null;
 const ws=allWorkouts().filter(w=>dkey(w.start)===d),fs=foodsOn(d),wt=allWeights().filter(w=>dkey(w.t)===d).pop();
 openSheet(`<h2>${dayLabel(d)}</h2><div class="small muted" style="margin:-10px 0 14px">${fmtD(d+'T12:00')}</div>
 <div class="tiles">${tile(st?fmtN(st.steps):'--','steps')}${tile(k!=null?fmtN(k):'--','active kcal')}${tile(fmtN(sumF(fs,'kcal')),'kcal eaten')}${tile(ws.length,'workouts')}${tile(dur(ws.reduce((a,w)=>a+(w.end-w.start)/60e3,0)),'exercise')}${tile(wt?kgToU(wt.kg).toFixed(1)+'<small>'+S.settings.unit+'</small>':'--','weight')}</div>
 <div class="sec">Workouts</div>${workoutList(ws)}
 <div class="sec">Food</div>${fs.length?'<div class="list">'+fs.map(x=>`<div class="li"><div class="m"><div class="t">${esc(x.name)}</div><div class="s">${x.meal}</div></div><div class="r num">${fmtN(x.kcal)}<small>kcal</small></div></div>`).join('')+'</div>':'<div class="muted small">Nothing logged</div>'}
 <div style="height:14px"></div><div class="row" style="gap:8px"><button class="btn ghost" style="flex:1" id="gofood">Open food log</button><button class="btn" style="flex:1" data-close>Close</button></div>`,r=>{r.querySelector('[data-close]').onclick=closeSheet;r.querySelector('#gofood').onclick=()=>{foodDay=d;closeSheet();go('food');render()}});
}
function sheetWeek(){
 const t0=addDays(sod(new Date()),-6).getTime(),ws=allWorkouts().filter(w=>w.start>=t0),by={};
 ws.forEach(w=>{const k=typeName(w.type);(by[k]=by[k]||{n:0,m:0,k:0,t:w.type});by[k].n++;by[k].m+=(w.end-w.start)/60e3;by[k].k+=w.kcal||0});
 const days=new Set(ws.map(w=>dkey(w.start))).size, mins=ws.reduce((a,w)=>a+(w.end-w.start)/60e3,0);
 openSheet(`<h2>Last 7 days</h2>
 <div class="tiles">${tile(ws.length,'workouts')}${tile(dur(mins),'total time')}${tile(fmtN(sumF(ws,'kcal')),'kcal')}${tile(days+'/7','active days')}${tile(ws.length?dur(mins/ws.length):'--','avg length')}${tile(Math.round(Math.min(100,mins/150*100))+'<small>%</small>','of 150 min goal')}</div>
 <div class="sec">By activity</div>${Object.entries(by).length?'<div class="list">'+Object.entries(by).sort((a,b)=>b[1].m-a[1].m).map(([k,v])=>`<div class="li"><div class="ic">${ico(typeIcon(v.t),'#C5F25A')}</div><div class="m"><div class="t">${esc(k)}</div><div class="s">${v.n}× · ${dur(v.m)}</div></div><div class="r num">${fmtN(v.k)}<small>kcal</small></div></div>`).join('')+'</div>':'<div class="muted small">No workouts this week</div>'}
 <div class="sec">All workouts</div>${workoutList(ws)}
 <div class="tiny muted" style="margin-top:10px">Health guidelines suggest at least 150 minutes of moderate activity a week.</div>
 <div style="height:12px"></div><button class="btn block" data-close>Close</button>`,r=>r.querySelector('[data-close]').onclick=closeSheet);
}
function sheetWeightEntry(t){
 const all=allWeights(),i=all.findIndex(w=>w.t===t),w=all[i];if(!w)return;const prev=all[i-1],u=S.settings.unit,hm=(+S.settings.heightCm||0)/100;
 const bmi=hm?w.kg/(hm*hm):null;
 openSheet(`<h2>${kgToU(w.kg).toFixed(1)} ${u}</h2><div class="small muted" style="margin:-10px 0 14px">${fmtD(w.t)} · ${fmtT(w.t)} · ${w.local?'logged in Pulse':'from Google Health'}</div>
 <div class="tiles">${tile(prev?((kgToU(w.kg)-kgToU(prev.kg))>0?'+':'')+(kgToU(w.kg)-kgToU(prev.kg)).toFixed(1):'--','vs previous')}${tile(bmi?bmi.toFixed(1):'--','BMI'+(hm?'':' (add height)'))}${tile(S.settings.goalWeight?(kgToU(w.kg)-S.settings.goalWeight).toFixed(1):'--','to goal')}</div>
 <div class="row" style="gap:8px">${w.local?'<button class="btn danger" id="del" style="flex:1">Delete</button>':''}<button class="btn" style="flex:1" data-close>Close</button></div>`,r=>{r.querySelector('[data-close]').onclick=closeSheet;const d=r.querySelector('#del');if(d)d.onclick=()=>{S.weights=S.weights.filter(x=>x.id!==w.id);save();closeSheet();render();toast('Deleted')}});
}
// Drag / touch across a heart-rate chart to see exact values
function scrubAt(el,clientX){
 const c=window.__charts[el.dataset.k];if(!c||!c.ds.length)return;const r=el.getBoundingClientRect();
 const fx=(clientX-r.left)/r.width*c.W, t=c.t0+(fx-c.pl)/(c.W-c.pl-c.pr)*(c.tEnd-c.t0);
 let lo=0,hi=c.ds.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(c.ds[m].t<t)lo=m;else hi=m}
 const p=Math.abs(c.ds[lo].t-t)<Math.abs(c.ds[hi].t-t)?c.ds[lo]:c.ds[hi];
 const px=(c.pl+(p.t-c.t0)/(c.tEnd-c.t0)*(c.W-c.pl-c.pr))/c.W*r.width, z=zoneOf(p.bpm);
 const v=el.querySelector('.vline'),tip=el.querySelector('.tip');v.style.display=tip.style.display='block';v.style.left=px+'px';
 tip.style.left=Math.max(50,Math.min(r.width-50,px))+'px';tip.innerHTML=`<span style="color:${z.c}">${Math.round(p.bpm)} bpm</span> · ${fmtT(p.t)} · ${z.n}`;
}
['pointerdown','pointermove'].forEach(ev=>document.addEventListener(ev,e=>{const el=e.target.closest&&e.target.closest('.scrub');if(el&&(ev==='pointermove'||e.isPrimary))scrubAt(el,e.clientX)},{passive:true}));
document.addEventListener('pointerleave',e=>{},true);
document.addEventListener('pointerout',e=>{const el=e.target.closest&&e.target.closest('.scrub');if(el&&!el.contains(e.relatedTarget)){el.querySelector('.vline').style.display=el.querySelector('.tip').style.display='none'}});

/* ============ Render & events ============ */
const TABS=[['today','Today','home'],['workouts','Workouts','run'],['food','Food','food'],['weight','Weight','scale'],['coach','Coach','coach']];
function render(){
 const v={today:vToday,workouts:vWorkouts,food:vFood,weight:vWeight,coach:vCoach}[tab];
 $('#app').innerHTML=v();
 $('#nav').innerHTML=TABS.map(([k,l,i])=>`<button class="${tab===k?'on':''}" data-a="tab" data-t="${k}">${ico(i)}<span>${l}</span></button>`).join('');
 const f=$('#askf'); if(f) f.addEventListener('submit',e=>{e.preventDefault();const q=$('#askq').value;$('#askq').value='';sendAsk(q)});
}
function go(t){ if(t===tab)return; tab=t; if(location.hash!=='#'+t) history.replaceState(null,'','#'+t); render(); window.scrollTo(0,0) }
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]'); if(!el) return; const a=el.dataset.a;
 if(a==='tab') go(el.dataset.t);
 else if(a==='settings') sheetSettings();
 else if(a==='sync') syncHealth(true);
 else if(a==='logw') sheetWorkout();
 else if(a==='logdet') sheetWorkout({start:+el.dataset.s,end:+el.dataset.e,kcal:+el.dataset.k||0,detected:true,type:'WORKOUT'});
 else if(a==='dismiss'){S.dismissed.push(Math.round(+el.dataset.s/60e3));save();render();toast('Got it — hidden')}
 else if(a==='delw'){S.workouts=S.workouts.filter(w=>w.id!==el.dataset.id);save();render();toast('Removed from this app')}
 else if(a==='logf') sheetFood(el.dataset.m);
 else if(a==='delf'){S.foods=S.foods.filter(f=>f.id!==el.dataset.id);save();render()}
 else if(a==='fday'){const n=dkey(addDays(foodDay+'T12:00',+el.dataset.d));if(n<=dkey(new Date())){foodDay=n;render()}}
 else if(a==='logwt') sheetWeight();
 else if(a==='delwt'){S.weights=S.weights.filter(w=>w.id!==el.dataset.id);save();render()}
 else if(a==='wr'){weightRange=+el.dataset.d;render()}
 else if(a==='ask') sendAsk(el.dataset.q);
 else if(a==='clearchat'){S.chat=[];save();render()}
 else if(a==='sleep') sheetSleep();
 else if(a==='startw') sheetStart();
 else if(a==='resume') openLive();
 else if(a==='wdetail'){const w=findWorkout(el.dataset.id);if(w)sheetWorkoutDetail(w)}
 else if(a==='detview') sheetDetected(+el.dataset.s,+el.dataset.e);
 else if(a==='hr') sheetHR();
 else if(a==='steps') sheetSteps();
 else if(a==='kcal') sheetKcal();
 else if(a==='day') sheetDay(el.dataset.d);
 else if(a==='week') sheetWeek();
 else if(a==='older') loadOlderWorkouts();
 else if(a==='editf'){const f=S.foods.find(x=>x.id===el.dataset.id);if(f)sheetFood(f.meal,f)}
 else if(a==='wtdetail') sheetWeightEntry(+el.dataset.t);
});
$('#scrim').addEventListener('click',closeSheet);
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(TABS.some(x=>x[0]===t))go(t)});
{const t=location.hash.slice(1);if(TABS.some(x=>x[0]===t))tab=t}
render();
// refresh: re-sync when app comes back to foreground, and every 5 min while open
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!S.settings.demo&&S.settings.connected&&(!S.lastSync||Date.now()-S.lastSync>3*60e3))syncHealth()});
setInterval(()=>{if(!document.hidden){if(!S.settings.demo&&S.settings.connected)syncHealth();else if(tab==='today')render()}},5*60e3);
if(!S.settings.demo&&S.settings.connected&&token) syncHealth();
if(S.active) openLive();
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
